name: "Build PR"
on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-build-pr
  cancel-in-progress: true

# Read-only token. Every job checks out, resolves the parent POM and build-tools from GitHub
# Packages, and exchanges artifacts within the run; none writes to the repository, and a
# workflow that declares no permissions inherits whatever the repository default grants.
permissions:
  contents: read
  packages: read

jobs:
  # A coupled interfaces change cannot be validated here until it merges, so a
  # marker in the PR body redirects this build at the interfaces PR's own
  # snapshot for the duration of review. The pom is never touched: core's
  # ruleset dismisses approvals on push and forbids self-approval of the push,
  # so a revert commit would cost the author a second review round.
  resolve-interfaces:
    name: Resolve interfaces version
    runs-on: ubuntu-latest
    outputs:
      mvnarg:   ${{ steps.resolve.outputs.mvnarg }}
      override: ${{ steps.resolve.outputs.override }}
    steps:
      # No checkout: nothing here reads the working tree.
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          emit() { echo "mvnarg=$1" >>"$GITHUB_OUTPUT"; echo "override=$2" >>"$GITHUB_OUTPUT"; }

          # merge_group carries no pull_request object; build against the pom.
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull_request event - using the pom value."
            emit "" "none"; exit 0
          fi

          # Fetched live rather than read from github.event.pull_request.body: a
          # re-run replays the original payload, so an edited marker would be
          # invisible and the override could never be cleared without a push -
          # which dismisses the approval. It also keeps raw body text out of the
          # environment.
          BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR" --jq '.body // ""')

          NUM=$(printf '%s' "$BODY" \
            | grep -oiP '^Depends-On:[[:space:]]*OmniTrustILM/interfaces#\K[0-9]{1,7}(?=[[:space:]]*$)' \
            | head -1 || true)
          VER=$(printf '%s' "$BODY" \
            | grep -oiP '^Interfaces-Version:[[:space:]]*\K[0-9][0-9A-Za-z.\-]{0,60}(?=[[:space:]]*$)' \
            | head -1 || true)
          # Anchored to end of line, so a marker with trailing junk cannot
          # silently become a different valid override - `Interfaces-Version:
          # 2.20.0; rm -rf /` would otherwise truncate to a pin on 2.20.0. And a
          # line that is present but does not match is an error rather than a
          # silent no-op: the author believes they pinned something.
          if printf '%s' "$BODY" | grep -qiP '^Depends-On:' && [ -z "$NUM" ]; then
            echo "::error::A Depends-On: line is present but malformed. Expected: Depends-On: OmniTrustILM/interfaces#<number>"
            exit 1
          fi
          if printf '%s' "$BODY" | grep -qiP '^Interfaces-Version:' && [ -z "$VER" ]; then
            echo "::error::An Interfaces-Version: line is present but malformed. Expected a published version, e.g. Interfaces-Version: 2.20.0-M904-bea47fb9"
            exit 1
          fi

          # Constrained by the regexes above to a charset with no shell
          # metacharacters, which is what licenses interpolating mvnarg directly
          # into the run: blocks of the compile, test and package jobs.
          if [ -n "$VER" ]; then
            echo "Explicit override: $VER"
            emit "-Dinterfaces.version=$VER" "explicit"; exit 0
          fi

          if [ -z "$NUM" ]; then
            emit "" "none"; exit 0
          fi

          # Self-clearing: once the interfaces PR merges, the same unchanged
          # marker stops meaning "override" and starts meaning "nothing to do".
          if [ "$(gh api "repos/OmniTrustILM/interfaces/pulls/$NUM" --jq .merged)" = true ]; then
            echo "interfaces#$NUM is merged - using the mainline pom value."
            emit "" "none"; exit 0
          fi

          # Looked up rather than derived from core's own property: across a
          # release cut interfaces publishes 2.21.0-alpha-PR<n>-SNAPSHOT while
          # this pom still reads 2.20.0, and deriving would resolve a stale
          # pre-bump artifact.
          PRV=$(gh api --paginate \
                  /orgs/OmniTrustILM/packages/maven/com.otilm.interfaces/versions \
                  --jq '.[].name' \
                | grep -E -- "-alpha-PR${NUM}-SNAPSHOT\$" | head -1 || true)

          if [ -z "$PRV" ]; then
            echo "::error::No published snapshot for interfaces#${NUM}. It needs the publish-snapshot label and a finished build. Fork PRs never publish - their token is read-only."
            exit 1
          fi

          echo "interfaces#$NUM is open - building against $PRV"
          emit "-Dinterfaces.version=$PRV" "pr"

      - name: Summarise
        env:
          MODE: ${{ steps.resolve.outputs.override }}
          ARG: ${{ steps.resolve.outputs.mvnarg }}
        run: |
          set -euo pipefail
          {
            echo "### Interfaces resolution"
            echo ""
            echo "- mode: \`$MODE\`"
            echo "- mvn arg: \`${ARG:-(none)}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Required to be green before merge, so an override can never reach main.
  # Red on both override modes; `pr` clears itself once the interfaces PR
  # merges and the workflow is re-run, `explicit` only when the line is deleted.
  pin-gate:
    name: Interfaces pin
    needs: resolve-interfaces
    runs-on: ubuntu-latest
    steps:
      - name: Reject an active interfaces override
        env:
          MODE: ${{ needs.resolve-interfaces.outputs.override }}
        run: |
          case "$MODE" in
            none) echo "No override active." ;;
            pr)   echo "::error::Building against an unmerged interfaces PR. Merge it, wait for the publish, then re-run all jobs."; exit 1 ;;
            explicit) echo "::error::An explicit Interfaces-Version override is active. Remove the marker from the PR body and re-run before merging."; exit 1 ;;
            *) echo "::error::Unknown resolver mode '$MODE'"; exit 1 ;;
          esac

  formatting:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      # Both goals are bound to verify in the parent POM, and no job here goes past package,
      # so without this the gates would never run on a PR. Neither goal needs compiled output,
      # so this is a fast job independent of the compile/test chain.
      - name: Check formatting and lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # resolves com.otilm parent and build-tools from GitHub Packages
        run: mvn -B -U -ntp spotless:check checkstyle:check

  compile:
    name: Compile
    needs: resolve-interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      - name: Compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: >-
          mvn -B -U -ntp test-compile -Dmaven.compiler.proc=full
          ${{ needs.resolve-interfaces.outputs.mvnarg }}

      - name: Package compiled output
        run: tar -czf compiled.tar.gz target/classes target/test-classes

      - name: Upload compiled output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled
          path: compiled.tar.gz
          retention-days: 7

  test:
    name: Test (${{ matrix.group }})
    needs: [compile, resolve-interfaces]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [non-integration, integration-core, integration-service-1, integration-service-2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled

      - name: Extract compiled output
        run: tar -xzf compiled.tar.gz

      - name: Run ${{ matrix.group }} tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: >-
          mvn -B -U -ntp test -Ptest-${{ matrix.group }} -Dmaven.compiler.skip=true
          ${{ needs.resolve-interfaces.outputs.mvnarg }}

      - name: Upload coverage exec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-exec-${{ matrix.group }}
          path: target/jacoco.exec
          retention-days: 7

  package:
    name: Package
    needs: [test, resolve-interfaces]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled

      - name: Extract compiled output
        run: tar -xzf compiled.tar.gz

      - name: Download non-integration coverage exec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-exec-non-integration
          path: jacoco-partial/group1

      - name: Download integration-core coverage exec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-exec-integration-core
          path: jacoco-partial/group2

      - name: Download integration-service-1 coverage exec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-exec-integration-service-1
          path: jacoco-partial/group3

      - name: Download integration-service-2 coverage exec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-exec-integration-service-2
          path: jacoco-partial/group4

      - name: Rename partial exec files for merge
        run: |
          mv jacoco-partial/group1/jacoco.exec jacoco-partial/jacoco-non-integration.exec
          mv jacoco-partial/group2/jacoco.exec jacoco-partial/jacoco-integration-core.exec
          mv jacoco-partial/group3/jacoco.exec jacoco-partial/jacoco-integration-service-1.exec
          mv jacoco-partial/group4/jacoco.exec jacoco-partial/jacoco-integration-service-2.exec

      - name: Merge coverage, generate report, and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: >-
          mvn -B -U -ntp package -DskipTests -Pmerge-coverage -Dmaven.compiler.skip=true
          ${{ needs.resolve-interfaces.outputs.mvnarg }}

      # Write PR number to file
      - name: Write PR number to file
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      # Upload PR number artifact
      - name: Upload PR number artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-number
          path: pr-number.txt

      # Upload compiled classes
      - name: Upload Compiled Classes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-classes
          path: target/classes

      # Upload Jacoco XML report(s)
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: target/site/jacoco/jacoco.xml

  generated:
    name: Generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The generator is deterministic on any CPython 3.7+, so this pin is not a requirement
      # of the script - it pins the interpreter the proof is carried out on, so a runner image
      # bump can never quietly become the reason the bytes changed.
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # cbom/identity-tables.json is committed so that builds stay offline and need no Python:
      # every developer and every release build reads the bytes straight from the repository.
      # That is only safe while the committed bytes are provably the generator's output, which
      # is what this step establishes. It regenerates the artifact in place from the inputs
      # under src/main/cbom/identity and fails if a single byte moved.
      #
      # It catches a hand-edit to the artifact that no input justifies. The complementary
      # failure - a legitimate input change that silently re-keys the inventory - is caught by
      # the SHA-256 pin in IdentityTablesTest, which forces the new hash to be ratified in the
      # same commit. Neither guard subsumes the other.
      - name: Regenerate the CBOM identity tables
        run: python3 scripts/cbom/build_identity_tables.py --output src/main/resources/cbom/identity-tables.json

      - name: Fail if the committed tables are not the generator's output
        run: |
          # git status, not git diff: if the committed artifact were deleted or moved, regeneration
          # writes an untracked file that `git diff` does not see, and the guard would pass on a
          # tree whose committed bytes are gone.
          if [ -n "$(git status --porcelain -- src/main/resources/cbom/identity-tables.json)" ]; then
            git status --short -- src/main/resources/cbom/identity-tables.json
            git diff -- src/main/resources/cbom/identity-tables.json
            echo
            echo "::error file=src/main/resources/cbom/identity-tables.json::The committed identity tables are not reproducible from the inputs in src/main/cbom/identity."
            echo "The status line above names what moved, and the diff - present only when the artifact is"
            echo "tracked and modified - is what regeneration produced minus what is committed. A deleted or"
            echo "untracked artifact shows in the status line with no diff, which is the case git diff missed."
            echo
            echo "To fix, run this and commit the result:"
            echo "  python3 scripts/cbom/build_identity_tables.py --output src/main/resources/cbom/identity-tables.json"
            echo
            echo "If the change is intended, it re-keys the cryptographic asset inventory: update the"
            echo "SHA-256 pinned by IdentityTablesTest in the same commit, and re-run the identity"
            echo "vector suite, ratifying every expectation that moves. IdentityRuleset.VERSION is a"
            echo "separate decision: a table edit that moves no key does not bump it, and one that does"
            echo "may skip the bump only while no environment holds a keyed row. See that class's"
            echo "Javadoc for the exemption and IdentityRulesetStampArchTest for what ends it."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      # cbom/corpus-keys.tsv is the second committed artifact of the identity chain: every identity key
      # the extractor produces for the authored documents under src/test/resources/cbom/corpus. It
      # exists because the ratified vectors are all single-component documents, so they cannot see
      # anything DocumentScope decides - suite refutation, assetType barring, a duplicated bom-ref,
      # a reference into a nested component - and the external corpus that can is third-party and
      # gated behind -Dcorpus.dir, which no CI job sets. Two certificate-key collisions landed green
      # that way. The step below keys the miniature corpus with CorpusKeySnapshotTest's own external
      # form and fails if a single row differs from the committed pin, naming the row that moved.
      - name: Key the miniature CBOM corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # resolves com.otilm parent and build-tools from GitHub Packages
        run: |
          mvn -B -U -ntp test -Dtest=CorpusKeySnapshotTest#snapshot -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcorpus.dir=src/test/resources/cbom/corpus -Dcorpus.out=target/corpus-keys.tsv

      - name: Fail if the committed corpus keys are not the instrument's output
        run: |
          if ! diff -u src/test/resources/cbom/corpus-keys.tsv target/corpus-keys.tsv; then
            echo
            echo "::error file=src/test/resources/cbom/corpus-keys.tsv::The miniature corpus keys differently from the committed pin."
            echo "Each '-' line above is a pinned row and the '+' line under it is what this head produces for the"
            echo "same document and asset index: a key that moved on a document-scoped shape the ratified vectors"
            echo "cannot see. Read it before re-pinning - the miniature corpus carries the shapes that let two"
            echo "certificate-key collisions land green. If the move is intended, re-pin and commit:"
            echo "  mvn -B test -Dtest=CorpusKeySnapshotTest#snapshot -Dsurefire.failIfNoSpecifiedTests=false \\"
            echo "    -Dcorpus.dir=src/test/resources/cbom/corpus -Dcorpus.out=src/test/resources/cbom/corpus-keys.tsv"
            exit 1
          fi

  build:
    name: Build
    needs: [package, formatting, generated, pin-gate]
    # Runs when an upstream job failed or was skipped, not only when all of them succeeded. With
    # the default condition this job is skipped whenever a dependency fails, and GitHub counts a
    # skipped required check as passing -- so a red `generated` or `formatting` job blocked the
    # merge only through the Sonar workflow declining to report. `!cancelled()` rather than
    # `always()`: a run superseded through cancel-in-progress should stay cancelled, not turn red.
    #
    # The converse constraint, because it is not obvious and it bites in the opposite direction:
    # `Build` is the only required Actions context on `main`, and the scan below counts a skipped
    # dependency as a failure. So adding `paths:` or an `if:` to `generated`, `formatting`,
    # `compile`, `test` or `package` would turn `Build` red on every PR that does not touch those
    # paths. Wanting a path filter therefore means teaching the scan to separate `skipped` (pass)
    # from `failure` and `cancelled` (fail), and changing the ruleset, in the same PR.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every upstream job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$not_ok" ]; then
            echo "::error::Upstream jobs did not succeed: $(echo "$not_ok" | paste -sd ',' -)"
            exit 1
          fi
          echo "Build complete"
