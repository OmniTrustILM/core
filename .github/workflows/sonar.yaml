name: Sonar
on:
  workflow_run:
    workflows: ["Build PR"]
    types: [completed]

jobs:
  # Gated on Package rather than the run conclusion: pin-gate fails by design on
  # a coupled PR, which would skip Sonar for exactly the PRs that need it most.
  # Every artifact this workflow downloads comes from Package.
  gate:
    name: Sonar precondition
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      analyse: ${{ steps.c.outputs.analyse }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # Falls back to the run conclusion when the read fails. SonarCloud Code
          # Analysis is a required context, so a bad read must not withhold it
          # from every pull request in the repository.
          # Keyed on exit status, not emptiness: gh prints an API error body to
          # stdout, so a failed read would otherwise look like a real answer.
          PKG=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
                  --jq '[.jobs[] | select(.name=="Package")][0].conclusion // ""' 2>/dev/null) || PKG=""
          case "$PKG" in
            success|failure|cancelled|skipped|neutral|timed_out|action_required) ;;
            *) PKG="" ;;
          esac
          echo "Package: ${PKG:-<unreadable>}  run conclusion: $RUN_CONCLUSION"
          if [ -z "$PKG" ]; then
            ANALYSE=$([ "$RUN_CONCLUSION" = success ] && echo true || echo false)
          elif [ "$PKG" = success ]; then
            ANALYSE=true
          else
            ANALYSE=false
          fi
          echo "analyse=$ANALYSE" >> "$GITHUB_OUTPUT"

  sonar:
    name: Sonar
    needs: gate
    if: needs.gate.outputs.analyse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Download the PR number artifact
      - name: Download PR number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-number
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .
      # Read the PR number from the file and store it in 'steps.pr_number.outputs.content'
      - name: Read PR number from file
        id: pr_number
        run: echo "content=$(cat pr-number.txt)" >> $GITHUB_OUTPUT
      # Request GitHub API for PR data
      - name: Request GitHub API for PR data
        if: github.event.workflow_run.event == 'pull_request'
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        id: get_pr_data
        with:
          route: GET /repos/${{ github.event.repository.full_name }}/pulls/${{ steps.pr_number.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # allow-unsafe-pr-checkout re-enables fork-PR checkout, refused by default
      # from workflow_run since checkout v6.1.0. Accepted only until the scan moves
      # to the sonar-scanner CLI, because the mvn step below executes the fork's
      # pom with SONAR_TOKEN in scope. Pinned to head_sha rather than the
      # fork-writable branch ref, so the tree matches the PR data read above.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
      # Checkout the base branch to keep the information about the new lines of code
      - name: Checkout base branch
        if: github.event.workflow_run.event == 'pull_request'
        # PR-derived values go through env, not ${{ }} in the script: git permits
        # ';' and backticks in ref names, so a crafted fork branch would execute.
        env:
          UPSTREAM_URL: ${{ github.event.repository.clone_url }}
          BASE_REF: ${{ fromJson(steps.get_pr_data.outputs.data).base.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          git checkout -B "$BASE_REF" "upstream/$BASE_REF"
          git checkout "$HEAD_SHA"
          git clean -ffdx && git reset --hard HEAD
      # Download compiled classes
      - name: Download Compiled Classes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-classes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: target/classes
      # Download Jacoco XML coverage files
      - name: Download Coverage Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: target/site/jacoco
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - name: Compute cache month
        id: cache-month
        run: echo "yearmonth=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.cache-month.outputs.yearmonth }}
          restore-keys: |
            ${{ runner.os }}-sonar-
      # SonarCloud Scan analysis and push
      # continue-on-error: a run predating this artifact still analyses, just
      # against the pom value.
      - name: Download the resolved interfaces argument
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: interfaces-mvnarg
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REVISION: ${{ github.event.workflow_run.head_sha }}
          SONAR_PR_KEY: ${{ fromJson(steps.get_pr_data.outputs.data).number }}
          SONAR_PR_BRANCH: ${{ fromJson(steps.get_pr_data.outputs.data).head.ref }}
          SONAR_PR_BASE: ${{ fromJson(steps.get_pr_data.outputs.data).base.ref }}
        run: |
          MVNARG=$(cat mvnarg.txt 2>/dev/null || true)
          # Unquoted: empty contributes no argument.
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar $MVNARG \
            -Dsonar.scm.revision="$SONAR_REVISION" \
            -Dsonar.pullrequest.key="$SONAR_PR_KEY" \
            -Dsonar.pullrequest.branch="$SONAR_PR_BRANCH" \
            -Dsonar.pullrequest.base="$SONAR_PR_BASE"
