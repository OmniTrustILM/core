name: Build
on:
  push:
    branches: [main*]
  workflow_dispatch:

# Read-only token. Every job checks out, resolves the parent POM and build-tools from GitHub
# Packages, and exchanges artifacts within the run; none writes to the repository, and a
# workflow that declares no permissions inherits whatever the repository default grants.
permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # Saved only from this trusted main build; the Sonar PR workflow restores it read-only.
      - name: Compute cache month
        id: cache-month
        run: echo "yearmonth=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.cache-month.outputs.yearmonth }}
          restore-keys: |
            ${{ runner.os }}-sonar-
      - name: Set up Python 3.12
        if: hashFiles('ai-runtime/proof/f01/resources/v1/tests/requirements.txt') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check runtime proof Python
        if: hashFiles('ai-runtime/proof/f01/resources/v1/tests/requirements.txt') != ''
        run: |
          python -I -m pip install --disable-pip-version-check -r ai-runtime/proof/f01/resources/v1/tests/requirements.txt
          python -I -B -m coverage run --rcfile=.coveragerc -m unittest discover -s ai-runtime/proof/f01/resources/v1/tests -p 'test_*.py'
          python -I -B -m coverage run --append --rcfile=.coveragerc -m unittest discover -s ai-runtime/proof/f01/resources/kernel-v1/tests -p 'test_*.py'
          python -I -B -m coverage report --rcfile=.coveragerc
          python -I -B -m coverage xml --rcfile=.coveragerc -o target/coverage/python.xml
      - name: Verify and install AI runtime contracts
        if: hashFiles('ai-runtime/pom.xml') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -U -ntp -f ai-runtime/pom.xml install
      - name: Check AI runtime analysis output
        if: hashFiles('ai-runtime/pom.xml') != ''
        run: |
          test -d ai-runtime/ai-runtime-protocol/target/classes
          test -d ai-runtime/ai-runtime-protocol/target/test-classes
          test -s ai-runtime/ai-runtime-protocol/target/site/jacoco/jacoco.xml
      - name: Check gateway analysis output
        if: hashFiles('ai-runtime/ai-connector-gateway/pom.xml') != ''
        run: |
          test -d ai-runtime/ai-connector-gateway/target/classes
          test -d ai-runtime/ai-connector-gateway/target/test-classes
          test -s ai-runtime/ai-connector-gateway/target/site/jacoco/jacoco.xml
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -U verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
