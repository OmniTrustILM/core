{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "ilm-sandbox-a2",
        "labels": {
          "pod-security.kubernetes.io/enforce": "restricted",
          "pod-security.kubernetes.io/enforce-version": "v1.36",
          "pod-security.kubernetes.io/audit": "restricted",
          "pod-security.kubernetes.io/warn": "restricted"
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "runner",
        "namespace": "ilm-sandbox-a2"
      },
      "automountServiceAccountToken": false
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "deny-all",
        "namespace": "ilm-sandbox-a2"
      },
      "spec": {
        "podSelector": {},
        "policyTypes": [
          "Ingress",
          "Egress"
        ]
      }
    },
    {
      "apiVersion": "crd.projectcalico.org/v1",
      "kind": "GlobalNetworkPolicy",
      "metadata": {
        "name": "ilm-sandbox-a2-deny"
      },
      "spec": {
        "order": 10,
        "selector": "projectcalico.org/namespace == 'ilm-sandbox-a2'",
        "types": [
          "Ingress",
          "Egress"
        ],
        "ingress": [
          {
            "action": "Deny"
          }
        ],
        "egress": [
          {
            "action": "Deny"
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ResourceQuota",
      "metadata": {
