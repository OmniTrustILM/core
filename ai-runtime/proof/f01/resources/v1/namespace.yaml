        "namespace": "ilm-sandbox-a2"
      },
      "spec": {
        "hard": {
          "pods": "1",
          "requests.cpu": "100m",
          "requests.memory": "64Mi",
          "limits.cpu": "500m",
          "limits.memory": "256Mi",
          "requests.ephemeral-storage": "16Mi",
          "limits.ephemeral-storage": "32Mi"
        }
      }
    },
    {
      "apiVersion": "node.k8s.io/v1",
      "kind": "RuntimeClass",
      "metadata": {
        "name": "runsc-f01-a2-v1"
      },
      "handler": "runsc-f01-a2-v1"
    }
  ]
