{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "f01-a2-floor-control",
    "namespace": "ilm-sandbox-a2",
    "labels": {
      "ilm.ai/proof": "a2-v1"
    }
  },
  "spec": {
    "os": {
      "name": "linux"
    },
    "runtimeClassName": "runsc-f01-a2-v1",
    "serviceAccountName": "runner",
    "automountServiceAccountToken": false,
    "enableServiceLinks": false,
    "restartPolicy": "Never",
    "activeDeadlineSeconds": 27,
    "terminationGracePeriodSeconds": 1,
    "dnsPolicy": "None",
    "dnsConfig": {
      "nameservers": [
        "127.0.0.1"
      ]
    },
    "securityContext": {
      "runAsNonRoot": true,
      "runAsUser": 65532,
      "runAsGroup": 65532,
      "fsGroup": 65532,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "fixed-proof",
        "image": "docker.io/library/busybox@sha256:d82c2ab94640ded77cf76514ce6a84870761105058a4a9e51b05a8a79be97a6c",
        "imagePullPolicy": "Never",
        "command": [
          "/bin/busybox",
          "ash",
          "-c"
        ],
        "args": [
          "set -eu; id; uname -a; dmesg | head -5; test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token; echo TOKEN_ABSENT; test ! -S /run/host-services/ssh-auth.sock; echo HOST_AGENT_ABSENT; grep -Eq \"^[^ ]+ / [^ ]+ ro([ ,]|$)\" /proc/mounts; echo ROOT_MOUNT_READONLY; touch /scratch/floor-v1; test -f /tmp/floor-v1; echo SHARED_SCRATCH_WRITABLE; grep -E \" /(scratch|tmp) \" /proc/mounts; echo FLOOR_V1_READY; cat /proc/self/limits; test \"$(id -u)\" = 65532; if (ulimit -u 257); then echo NPROC_RAISE_UNEXPECTED; exit 42; else echo NPROC_RAISE_REFUSED; fi; echo A2_FLOOR_READY; sleep 12"
        ],
        "securityContext": {
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          }
        },
        "resources": {
          "requests": {
            "cpu": "100m",
            "memory": "64Mi",
            "ephemeral-storage": "16Mi"
          },
          "limits": {
            "cpu": "500m",
            "memory": "256Mi",
            "ephemeral-storage": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "scratch",
            "mountPath": "/scratch"
          },
          {
            "name": "scratch",
            "mountPath": "/tmp"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "scratch",
        "emptyDir": {
          "medium": "Memory",
          "sizeLimit": "16Mi"
        }
      }
    ]
  }
}
