{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "f01-a2-cpu-deadline",
    "namespace": "ilm-sandbox-a2",
    "labels": {
      "ilm.ai/proof": "a2-v1"
    }
  },
  "spec": {
    "os": {
      "name": "linux"
    },
    "runtimeClassName": "runsc-f01-a2-v1",
    "serviceAccountName": "runner",
    "automountServiceAccountToken": false,
    "enableServiceLinks": false,
    "restartPolicy": "Never",
    "activeDeadlineSeconds": 27,
    "terminationGracePeriodSeconds": 1,
    "dnsPolicy": "None",
    "dnsConfig": {
      "nameservers": [
        "127.0.0.1"
      ]
    },
    "securityContext": {
      "runAsNonRoot": true,
      "runAsUser": 65532,
      "runAsGroup": 65532,
      "fsGroup": 65532,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "fixed-proof",
        "image": "docker.io/library/busybox@sha256:d82c2ab94640ded77cf76514ce6a84870761105058a4a9e51b05a8a79be97a6c",
        "imagePullPolicy": "Never",
        "command": [
          "/bin/busybox",
          "ash",
          "-c"
        ],
        "args": [
          "set +e\nprintf 'CPU_BEGIN\\n'\n/bin/busybox timeout -s KILL 10 /bin/busybox awk 'BEGIN { x=0; for (i=0; i<100000000; i++) x=(x+i)%104729; print x }'\nrc=$?\nprintf 'CPU_END %s\\n' \"$rc\"\nexec /bin/busybox sleep 60"
        ],
        "securityContext": {
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          }
        },
        "resources": {
          "requests": {
            "cpu": "100m",
            "memory": "64Mi",
            "ephemeral-storage": "16Mi"
          },
          "limits": {
            "cpu": "500m",
            "memory": "256Mi",
            "ephemeral-storage": "32Mi"
          }
        },
        "volumeMounts": [
          {
            "name": "scratch",
            "mountPath": "/scratch"
          },
          {
            "name": "scratch",
            "mountPath": "/tmp"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "scratch",
        "emptyDir": {
          "medium": "Memory",
          "sizeLimit": "16Mi"
        }
      }
    ]
  }
}
