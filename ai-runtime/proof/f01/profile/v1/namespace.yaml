{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "ilm-sandbox",
        "labels": {
          "pod-security.kubernetes.io/enforce": "restricted",
          "pod-security.kubernetes.io/enforce-version": "v1.36",
          "pod-security.kubernetes.io/audit": "restricted",
          "pod-security.kubernetes.io/warn": "restricted"
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "runner",
        "namespace": "ilm-sandbox"
      },
      "automountServiceAccountToken": false
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "deny-all",
        "namespace": "ilm-sandbox"
      },
      "spec": {
        "podSelector": {},
        "policyTypes": [
          "Ingress",
          "Egress"
        ]
      }
    },
    {
      "apiVersion": "crd.projectcalico.org/v1",
      "kind": "GlobalNetworkPolicy",
      "metadata": {
        "name": "ilm-sandbox-deny"
      },
      "spec": {
        "order": 10,
        "selector": "projectcalico.org/namespace == 'ilm-sandbox'",
        "types": [
          "Ingress",
          "Egress"
        ],
        "ingress": [
          {
            "action": "Deny"
          }
        ],
        "egress": [
          {
            "action": "Deny"
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ResourceQuota",
      "metadata": {
        "name": "bounded-lab",
        "namespace": "ilm-sandbox"
      },
      "spec": {
        "hard": {
          "pods": "4",
          "requests.cpu": "1",
          "requests.memory": "512Mi",
          "limits.cpu": "2",
          "limits.memory": "1Gi",
          "requests.ephemeral-storage": "128Mi",
          "limits.ephemeral-storage": "256Mi"
        }
      }
    },
    {
      "apiVersion": "node.k8s.io/v1",
      "kind": "RuntimeClass",
      "metadata": {
        "name": "runsc"
      },
      "handler": "runsc"
    }
  ]
}
